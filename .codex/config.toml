# Keep these integrations scoped to this project.
[mcp_servers.linear]
enabled = true
url = "https://mcp.linear.app/mcp"

[mcp_servers.unityMCP]
enabled = true
url = "http://127.0.0.1:8080/mcp"

[mcp_servers.unityMCP.tools.read_console]
approval_mode = "approve"

[mcp_servers.blender]
enabled = true
command = 'C:\Users\Piotr\AppData\Local\Microsoft\WinGet\Packages\astral-sh.uv_Microsoft.Winget.Source_8wekyb3d8bbwe\uvx.exe'
args = ["--managed-python", "--python", "3.11", "blender-mcp==1.9.1"]
startup_timeout_sec = 60
tool_timeout_sec = 180

[mcp_servers.blender.env]
BLENDER_HOST = "127.0.0.1"
BLENDER_PORT = "9876"
DISABLE_TELEMETRY = "true"
PYTHONIOENCODING = "utf-8"
